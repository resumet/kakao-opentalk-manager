name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example, v1.20)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate version metadata
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+(?:\.\d+)?$') {
            throw "Invalid release tag: $tag"
          }

          $tagCommit = git rev-list -n 1 $tag
          if (-not $tagCommit) {
            throw "The tag does not exist in the repository: $tag"
          }

          $readme = Get-Content -Raw -Encoding UTF8 README.md
          if (-not $readme.Contains("배포 버전: $tag.")) {
            throw "README.md does not declare release version $tag."
          }

          $agents = Get-Content -Raw -Encoding UTF8 AGENTS.md
          if (-not ($agents.Contains('현재 배포 버전은') -and $agents.Contains($tag))) {
            throw "AGENTS.md does not declare release version $tag."
          }

          "EXE_NAME=KakoMVP-$tag.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows x64 standalone EXE
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio locator was not found."
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio C++ x64 build tools were not found."
          }

          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) {
            throw "vcvars64.bat was not found."
          }

          @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          rc /nologo /fo resources.res resources.rc
          if errorlevel 1 exit /b 1
          cl /nologo /c /O2 /GS- /Zl /utf-8 /TC main.c /Fo:main.obj
          if errorlevel 1 exit /b 1
          cl /nologo /c /Od /Oi- /GS- /Zl /TC crt_shim.c /Fo:crt_shim.obj
          if errorlevel 1 exit /b 1
          link /nologo main.obj crt_shim.obj resources.res /SUBSYSTEM:WINDOWS /ENTRY:app_entry /NODEFAULTLIB /OUT:"%EXE_NAME%" kernel32.lib user32.lib gdi32.lib winhttp.lib shell32.lib
          if errorlevel 1 exit /b 1
          "@ | Set-Content -LiteralPath build-release.cmd -Encoding ascii

          & cmd.exe /d /c build-release.cmd
          if ($LASTEXITCODE -ne 0) {
            throw "MSVC build failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path -LiteralPath $env:EXE_NAME)) {
            throw "Expected executable was not created: $env:EXE_NAME"
          }

      - name: Verify executable and create checksum
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes($env:EXE_NAME)
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "The build output is not a valid PE executable."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $optionalHeader = $peOffset + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optionalHeader)
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($machine -ne 0x8664 -or $magic -ne 0x20B -or $subsystem -ne 2) {
            throw ('Unexpected PE format: machine=0x{0:X4}, magic=0x{1:X4}, subsystem={2}' -f $machine, $magic, $subsystem)
          }

          $file = Get-Item -LiteralPath $env:EXE_NAME
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumFile = "$($env:EXE_NAME).sha256.txt"
          "$hash  $($env:EXE_NAME)" | Set-Content -LiteralPath $checksumFile -Encoding ascii -NoNewline

          @"
          Windows 10/11 x64 standalone 실행 파일입니다.

          - 파일: ``$($env:EXE_NAME)``
          - 크기: $($file.Length) bytes
          - SHA-256: ``$hash``
          - 소스 커밋: ``${{ github.sha }}``

          실제 카카오톡 대화방을 대상으로 한 동작 검증 결과와 알려진 제약은 README.md를 확인하세요.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            choco install gh --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub CLI installation failed."
            }
          }

          $tag = $env:RELEASE_TAG
          $checksumFile = "$($env:EXE_NAME).sha256.txt"
          $repository = $env:GITHUB_REPOSITORY

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:EXE_NAME $checksumFile --repo $repository --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Uploading release assets failed."
            }
            gh release edit $tag --repo $repository --title "KakoMVP $tag" --notes-file release-notes.md --latest
          } else {
            gh release create $tag $env:EXE_NAME $checksumFile --repo $repository --title "KakoMVP $tag" --notes-file release-notes.md --generate-notes --verify-tag --latest
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the GitHub Release failed."
          }
